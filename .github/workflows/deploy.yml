name: Deploy to GitHub Pages

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init external/raylib

      - uses: mymindstorm/setup-emsdk@v14

      - name: Build for Web
        run: |
          mkdir -p build/web
          cd build/web
          emcmake cmake ../.. -DPLATFORM=Web
          emmake make -j$(nproc)

      - name: Prepare site
        run: |
          mkdir -p site
          cp build/web/gui/chess_gui.html site/index.html
          cp build/web/gui/chess_gui.js   site/
          cp build/web/gui/chess_gui.wasm site/
          cp build/web/gui/chess_gui.data site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
